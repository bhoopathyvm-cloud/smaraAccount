# --enable-native-access=ALL-UNNAMED: workaround for Gradle's bundled
# native-platform calling System.load from the unnamed module (JDK 24+ warns,
# and a future JDK will make it an error). Drop when a future Gradle wrapper
# bump ships a native-platform that declares native access itself.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
