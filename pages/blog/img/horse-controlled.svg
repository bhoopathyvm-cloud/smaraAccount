<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same horse again, now calm, with a rider on its back holding the reins, its speed pointed somewhere on purpose">
  <g fill="currentColor" stroke="none">
    <!-- tail -->
    <path d="M 78 82 C 60 88, 48 98, 42 114 C 39 122, 44 127, 50 121 C 55 116, 62 104, 74 90 Z" />
    <!-- legs -->
    <rect x="86" y="110" width="9" height="38" rx="4" />
    <rect x="100" y="112" width="9" height="36" rx="4" />
    <rect x="140" y="112" width="9" height="36" rx="4" />
    <rect x="154" y="108" width="9" height="40" rx="4" />
    <!-- body -->
    <ellipse cx="115" cy="95" rx="45" ry="24" />
    <!-- neck-body join filler -->
    <ellipse cx="140" cy="78" rx="18" ry="17" />
    <!-- neck -->
    <ellipse cx="152" cy="62" rx="26" ry="14" transform="rotate(-55 152 62)" />
    <!-- head -->
    <ellipse cx="193" cy="38" rx="24" ry="11" transform="rotate(15 193 38)" />
    <!-- ear -->
    <path d="M 178 26 L 182 10 L 189 24 Z" />
    <!-- mane, shorter and neater than the wild/training scenes -->
    <path d="M 178 30 L 170 28 L 175 22 Z" />
    <path d="M 168 42 L 160 41 L 165 34 Z" />
  </g>
  <!-- rider -->
  <g fill="currentColor" stroke="none">
    <circle cx="132" cy="42" r="7" />
    <path d="M 126 49 C 122 57, 122 67, 126 74 L 140 74 C 142 65, 140 55, 136 49 Z" />
  </g>
  <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
    <path d="M 130 72 C 132 82, 130 92, 122 102" />
  </g>
  <!-- arm, short -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <path d="M 134 54 C 142 55, 148 55, 153 54" />
  </g>
  <!-- reins, thin, connecting the rider's hand to the horse's head -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M 153 54 C 168 46, 180 38, 190 32" />
  </g>
</svg>
