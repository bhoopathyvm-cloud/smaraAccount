<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same horse on a lunge line, circling a handler who is teaching it to respond to a line and a voice before anyone rides it">
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <!-- lunge circle on the ground -->
    <path d="M 55 146 A 145 92 0 0 1 210 60" stroke-dasharray="5 6" />
    <!-- lunge line from handler to horse's head -->
    <line x1="40" y1="118" x2="188" y2="34" stroke-dasharray="2 5" />
  </g>
  <g fill="currentColor" stroke="none">
    <!-- handler: a small figure holding the line -->
    <circle cx="22" cy="112" r="6" />
    <path d="M 22 118 L 22 134" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 22 134 L 14 148 M 22 134 L 30 148" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 22 122 L 40 118" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- tail -->
    <path d="M 78 82 C 60 88, 48 98, 42 114 C 39 122, 44 127, 50 121 C 55 116, 62 104, 74 90 Z" />
    <!-- legs -->
    <rect x="86" y="110" width="9" height="38" rx="4" />
    <rect x="100" y="112" width="9" height="36" rx="4" />
    <rect x="140" y="112" width="9" height="36" rx="4" />
    <rect x="154" y="108" width="9" height="40" rx="4" />
    <!-- body -->
    <ellipse cx="115" cy="95" rx="45" ry="24" />
    <!-- neck-body join filler -->
    <ellipse cx="140" cy="78" rx="18" ry="17" />
    <!-- neck -->
    <ellipse cx="152" cy="62" rx="26" ry="14" transform="rotate(-55 152 62)" />
    <!-- head -->
    <ellipse cx="193" cy="38" rx="24" ry="11" transform="rotate(15 193 38)" />
    <!-- ear -->
    <path d="M 178 26 L 182 10 L 189 24 Z" />
    <!-- mane -->
    <path d="M 178 30 L 165 30 L 174 22 Z" />
    <path d="M 168 42 L 155 43 L 163 34 Z" />
    <path d="M 158 55 L 146 57 L 153 48 Z" />
  </g>
</svg>
