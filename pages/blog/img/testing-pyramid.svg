<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A five-layer testing pyramid: 637 unit and widget tests at the base, 286 integration tests above that, 37 UI-driven acceptance tests above that, the same 37 tests run nightly across all 43 locales above that, and a manual macOS human verification pass at the very top before each release">
  <style>
    .band1 { fill: #526cfe; fill-opacity: 0.90; stroke: #526cfe; }
    .band2 { fill: #526cfe; fill-opacity: 0.68; stroke: #526cfe; }
    .band3 { fill: #526cfe; fill-opacity: 0.48; stroke: #526cfe; }
    .band4 { fill: #526cfe; fill-opacity: 0.30; stroke: #526cfe; }
    .band5 { fill: #526cfe; fill-opacity: 0.14; stroke: #526cfe; }
    .leader { stroke: #526cfe; opacity: 0.45; }
    .label-main { fill: #33408f; font-weight: bold; }
    .label-detail { fill: #5b6270; }
  </style>
  <rect x="0" y="0" width="760" height="320" fill="#fbfcff" />
  <g stroke-width="1.5" stroke-linejoin="round">
    <!-- Band A: apex - Human verification -->
    <polygon class="band1" points="170,20 138,72 202,72" />
    <!-- Band B: Nightly full acceptance runs -->
    <polygon class="band2" points="138,72 202,72 234,124 106,124" />
    <!-- Band C: UI-driven acceptance tests -->
    <polygon class="band3" points="106,124 234,124 266,176 74,176" />
    <!-- Band D: Integration tests -->
    <polygon class="band4" points="74,176 266,176 298,228 42,228" />
    <!-- Band E: base - Unit & widget tests -->
    <polygon class="band5" points="42,228 298,228 330,280 10,280" />
  </g>
  <g class="leader" stroke-width="1">
    <line x1="190" y1="46" x2="345" y2="46" />
    <line x1="222" y1="98" x2="345" y2="98" />
    <line x1="254" y1="150" x2="345" y2="150" />
    <line x1="286" y1="202" x2="345" y2="202" />
    <line x1="318" y1="254" x2="345" y2="254" />
  </g>
  <g font-family="sans-serif">
    <text class="label-main" x="352" y="43" font-size="14">Human verification</text>
    <text class="label-detail" x="352" y="60" font-size="11">macOS baseline pass, English only, before every release</text>

    <text class="label-main" x="352" y="95" font-size="14">Nightly full acceptance runs</text>
    <text class="label-detail" x="352" y="112" font-size="11">37 tests &#215; 43 locales, automated every night</text>

    <text class="label-main" x="352" y="147" font-size="14">UI-driven acceptance tests</text>
    <text class="label-detail" x="352" y="164" font-size="11">37 checks, drives the real, compiled app</text>

    <text class="label-main" x="352" y="199" font-size="14">Integration tests</text>
    <text class="label-detail" x="352" y="216" font-size="11">286 checks, real database, real local state</text>

    <text class="label-main" x="352" y="251" font-size="14">Unit &amp; widget tests</text>
    <text class="label-detail" x="352" y="268" font-size="11">637 checks, one behavior each, dependencies mocked</text>
  </g>
</svg>
