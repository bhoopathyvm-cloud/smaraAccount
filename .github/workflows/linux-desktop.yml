name: Linux Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux desktop
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev \
            xvfb dbus-x11 gnome-keyring

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux desktop
        run: flutter build linux --release --no-pub

      - name: Package Linux bundle
        run: tar -C build/linux/x64/release -czf linux-desktop.tar.gz bundle

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: linux-desktop-${{ github.sha }}
          path: linux-desktop.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Start virtual display, D-Bus session, and keyring
        run: |
          set -e
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 3

          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

          eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
          eval "$(gnome-keyring-daemon --start --components=secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"

      - name: Launch the built app and confirm it stays up
        run: |
          set -e
          build/linux/x64/release/bundle/smara_accounting &
          APP_PID=$!
          sleep 10

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App is still running after 10s - launch succeeded."
            kill "$APP_PID"
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "App exited within 10s of launch - treating as a failure."
            wait "$APP_PID"
          fi

      - name: Run the onboarding acceptance group on Linux
        run: |
          flutter test integration_test/acceptance/acceptance_test.dart \
            -d linux --plain-name "onboarding"

      - name: Run the identity_restore acceptance group on Linux
        run: |
          flutter test integration_test/acceptance/acceptance_test.dart \
            -d linux --plain-name "identity_restore"
