name: Linux Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux desktop
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux desktop
        run: flutter build linux --release --no-pub

      - name: Package Linux bundle
        run: tar -C build/linux/x64/release -czf linux-desktop.tar.gz bundle

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-${{ github.sha }}
          path: linux-desktop.tar.gz
          if-no-files-found: error
          retention-days: 7
