# Advanced CodeQL setup tailored for this Flutter repo.
#
# Analyzes GitHub Actions workflow YAML only. Do not add c-cpp, swift, or
# java-kotlin: those hits come from Flutter platform scaffolding and are
# what made default setup report "CodeQL is reporting warnings."
#
# After this workflow lands on main, turn OFF CodeQL default setup so it
# stops running in parallel:
#   Settings → Code security → Code scanning → CodeQL → Disable default setup
# (This token cannot change that setting.)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, offset from security.yml's Monday 12:30 UTC cron.
    - cron: "30 13 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
