name: Dependency Scan on Push

# Scans the full dependency tree (OSV.dev) whenever a branch is pushed with a
# changed dependency manifest or lockfile, so a vulnerable package is caught
# before a pull request is opened. Pushes to main are already scanned by
# security.yml, and pull requests by its osv-scanner-pr job, so main is
# excluded here. Not a required check.

on:
  push:
    branches-ignore: [main]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "requirements.txt"

permissions:
  contents: read

# A newer push to the same branch supersedes the scan of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
