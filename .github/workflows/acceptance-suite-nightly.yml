name: Acceptance Suite Nightly

# Standing locale-regression gate (acceptance-suite-nightly-ci): runs the
# full real-device acceptance suite (tool/run_acceptance_tests.sh, ~37
# tests) against the Linux desktop target (-d linux, per
# add-linux-desktop-support) once nightly, across every supported locale.
# Replaces localized-release-verification's old manual, curated-9-locale,
# ~72-90h macOS sweep as the pre-release locale gate - proven via
# acceptance-suite-github-runner-spike to run all 43 locales in ~11
# minutes each on this runner, ~40-50x faster than the macOS process it
# replaces. See acceptance-test-suite's "Nightly Linux CI Tier"
# requirement.
#
# Uses ubuntu-latest, not the ubuntu-slim runner localized-smoke.yml uses:
# the spike's first dispatch on ubuntu-slim showed every one of 43 jobs's
# acceptance-suite step cancelled 8-12 minutes in regardless of real test
# progress - a reclaim/preemption ceiling intrinsic to that runner class,
# unrelated to this workflow's own timeout-minutes setting. ubuntu-latest
# has no such ceiling and already supports multi-hour jobs
# (linux-desktop.yml).
#
# Not a flutter-ci.yml gate: a failing or flaky locale on a given night
# does not block any pull request from merging. workflow_dispatch stays
# available for an on-demand run (e.g. release timing tighter than the
# nightly cadence).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-nightly:
    name: Locale ${{ matrix.locale }}
    # Scheduled runs are always the repo's own cron, not an external
    # trigger - safe unconditionally. A manual workflow_dispatch still
    # needs the owner-gate: github.actor on a schedule event is whoever
    # last edited the cron line, not a real "who triggered this", so
    # checking it there would be fragile rather than protective.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        locale:
          [
            en, ta, te, ml, kn, hi, ur, pa, ne, sa, doi, ks, mai, mr, gu,
            kok, sd, bn, as, or, mni, brx, sat, de, fr, es, it, pt, hu, ro,
            ja, zh, ko, ar, ru, id, tr, vi, th, ms, uk, pl, nl,
          ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev \
            xvfb dbus-x11 gnome-keyring

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Start virtual display, D-Bus session, and keyring
        run: |
          set -e
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 3

          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

          eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
          eval "$(gnome-keyring-daemon --start --components=secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"

      - name: Run the full acceptance suite for this locale
        run: tool/run_acceptance_tests.sh -d linux -l ${{ matrix.locale }}
