name: Localized Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localized-smoke:
    name: Locale ${{ matrix.locale }}
    if: github.actor == github.repository_owner
    runs-on: ubuntu-slim
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        locale:
          [
            en, ta, te, ml, kn, hi, ur, pa, ne, sa, doi, ks, mai, mr, gu,
            kok, sd, bn, as, or, mni, brx, sat, de, fr, es, it, pt, hu, ro,
            ja, zh, ko, ar, ru, id, tr, vi, th, ms, uk, pl, nl,
          ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run locale smoke test
        run: >
          flutter test
          test/l10n/curated_locale_smoke_test.dart
          test/acceptance_locale_fixtures_test.dart
          --dart-define=SMOKE_LOCALE=${{ matrix.locale }}
