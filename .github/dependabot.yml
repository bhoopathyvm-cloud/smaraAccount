# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # pubspec.yaml dependencies (this is a Flutter app).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    # Fewer simultaneous bot PRs means fewer CI runs.
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # Keep the GitHub Actions in .github/workflows/*.yml (including the CI
  # and security scanning workflows) pinned to current, patched versions -
  # an out-of-date Action is itself a supply-chain risk.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
