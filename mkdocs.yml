site_name: Smara
site_description: Smara — closing the gap between doing the work and the paperwork that proves it.
site_url: https://smara-ai.ch
repo_url: https://github.com/bhoopathyvm-cloud/smaraAccount
docs_dir: pages

nav:
  - Home: index.md
  - Open Source:
      - Projects: open-source/index.md
      - Smara Account:
          - Overview: open-source/smara-account/index.md
          - What's Built: open-source/smara-account/whats-built.md
          - Architecture: open-source/smara-account/architecture.md
          - How It Was Built: open-source/smara-account/how-it-was-built.md
          - Privacy Policy: open-source/smara-account/privacy-policy.md
  - About: about.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - search.suggest
